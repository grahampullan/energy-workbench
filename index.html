<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Energy Workbench — time-resolved energy modelling">
    <title>Energy Workbench</title>
    <link rel="stylesheet" href="/src/ui/workbench.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">EW</span>
          <div>
            <p class="eyebrow">Energy Workbench</p>
            <h1 id="model-name">Loading study…</h1>
          </div>
        </div>
        <div class="app-header-tools">
          <div class="project-actions" aria-label="Model file actions">
            <label class="example-picker" for="example-select">
              <span>Example</span>
              <select id="example-select">
                <option value="blog-electrical">PV and battery</option>
                <option value="coupled-thermal">Coupled thermal</option>
                <option value="batch-heating-synthetic">Batch heating</option>
                <option value="material-inventory-synthetic">Material inventory</option>
                <option value="ladle-cycle-historical">Ladle · historical</option>
                <option value="ladle-cycle-minimum-fuel">Ladle · temperature-led</option>
              </select>
            </label>
            <input
              id="open-model-file"
              type="file"
              accept=".json,application/json"
              hidden
            >
            <button id="open-model" type="button">Open model</button>
            <button id="save-model" type="button">Save model</button>
          </div>
          <div class="run-status" id="run-status" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            Preparing runtime
          </div>
        </div>
      </header>

      <p id="document-status" class="document-status" role="status" aria-live="polite"></p>

      <section id="run-kpis" class="run-kpis" aria-label="Run KPIs"></section>

      <section id="workspace" class="workspace">
        <section class="topology-panel" aria-labelledby="topology-title">
          <div class="panel-heading">
            <h2 id="topology-title">Model</h2>
            <button
              id="toggle-model-view"
              class="panel-action"
              type="button"
              aria-label="Expand Model panel"
              aria-pressed="false"
            >Expand</button>
          </div>
          <div class="topology-frame">
            <div class="topology-board-host">
              <div id="topology-board" aria-label="Energy system topology"></div>
            </div>
          </div>
        </section>

        <section class="results-panel" aria-labelledby="results-title">
          <div class="results-heading">
            <div>
              <h2 id="results-title">Results</h2>
            </div>
            <div class="results-view-controls" aria-label="Results chart view">
              <button id="show-power-chart" type="button" aria-pressed="true">Power</button>
              <button id="show-energy-chart" type="button" aria-pressed="false">Energy</button>
              <button id="show-mass-chart" type="button" aria-pressed="false" hidden>Mass</button>
              <button
                id="show-temperature-chart"
                type="button"
                aria-pressed="false"
                hidden
              >Temperature</button>
            </div>
          </div>
          <label class="results-input-toggle">
            <input id="show-scenario-inputs" type="checkbox">
            Show scenario inputs
          </label>
          <div id="results-chart" class="results-chart"></div>
          <div
            id="results-chart-legend"
            class="results-chart-legend"
            aria-label="Result series"
          ></div>
        </section>

        <aside class="inspector-panel" aria-labelledby="inspector-title">
          <div class="panel-heading">
            <h2 id="inspector-title">Inspector</h2>
          </div>
          <div id="inspector" class="inspector-empty">
            <h3 class="inspector-component-title">Select a component</h3>
            <p>Choose a component on the board to inspect its definition and current results.</p>
          </div>
        </aside>
      </section>
    </main>

    <template id="fatal-error-template">
      <section class="fatal-error" role="alert">
        <p class="eyebrow">Could not open study</p>
        <h2>Energy Workbench stopped safely</h2>
        <p class="fatal-error-message"></p>
      </section>
    </template>

    <script type="module" src="/build/workbench.js"></script>
  </body>
</html>
